name: v0.2 tests
on:
  push:
    branches: [main, "feature/v0.2-llm-analyst"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Golden release decisions
        run: python -m evals.run_evals
      - name: Conversational safety tests
        run: python -m unittest discover -s tests -p 'test_v02.py' -v
      - name: Compile Python
        run: python -m compileall -q .
